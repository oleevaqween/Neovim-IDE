# ~/.tmux.conf

# --- sane defaults ---
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g renumber-windows on

# --- plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-resurrect: also restore nvim (reopens in same directory)
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: auto-restore last session on tmux start, autosave every 15 min
set -g @continuum-restore 'on'

# --- melange-inspired status bar ---
set -g status-style "bg=#34302C,fg=#ECE1D7"
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 100

# Left: session name
set -g status-left "#[fg=#292522,bg=#A3A9CE,bold] #S #[fg=#A3A9CE,bg=#34302C,nobold]"

# Right: git branch (colored by dirty state) | date/time | hostname
set -g status-right "#(~/.tmux/scripts/git-branch.sh #{pane_current_path})#[fg=#867462] │ #[fg=#EBC06D]%a %d %b %H:%M #[fg=#867462]│ #[fg=#89B3B6]#H #[fg=#867462]│#(~/.tmux/scripts/cwd.sh #{pane_current_path}) "

# Window tabs: index, name, pane count, zoom flag
setw -g window-status-format "#[fg=#867462] #I:#W#{?#{!=:#{window_panes},1}, (#{window_panes}),}#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[fg=#ECE1D7,bg=#403A36,bold] #I:#W#{?#{!=:#{window_panes},1}, (#{window_panes}),}#{?window_zoomed_flag, Z,} #[fg=#403A36,bg=#34302C,nobold]"

# Pane borders
set -g pane-border-style "fg=#867462"
set -g pane-active-border-style "fg=#A3A9CE"

# Messages / command prompt
set -g message-style "bg=#403A36,fg=#ECE1D7"

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'
